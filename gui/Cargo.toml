[package]
name = "xblades-gui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "xblades-gui"
path = "src/main.rs"

[dependencies]
xblades-proto = { path = "../proto" }
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
